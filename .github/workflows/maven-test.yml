name: OpenCart Selenium Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Target browser for execution'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      suite:
        description: 'TestNG Suite XML file to run'
        required: true
        default: 'Master.xml'
        type: choice
        options:
          - Master.xml
          - ParallelTesting.xml
      headless:
        description: 'Run in headless mode'
        required: true
        default: true
        type: boolean

jobs:
  selenium-tests:
    name: Run Tests (${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Test Suite
        run: |
          mvn clean test \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=${{ github.event.inputs.headless || 'true' }} \
            -Dsurefire.suiteXmlFiles=${{ github.event.inputs.suite || 'Master.xml' }}

      - name: Upload Extent HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-reports
          path: reports/*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Automation Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
